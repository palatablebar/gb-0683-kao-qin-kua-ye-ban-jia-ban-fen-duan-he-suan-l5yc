<section class="panel exceptions"><header><h2>隔离记录（按来源可追溯）</h2><span>{{data.quarantine|length}} 条</span></header><div class="scroll"><table class="ledger"><thead><tr><th>来源</th><th>行</th><th>业务ID</th><th>原因</th></tr></thead><tbody>{% for q in data.quarantine %}<tr><td>{{q.source|default('—')}}</td><td class="rownum">{{q.line}}</td><td tabindex="0">{{q.id}}</td><td class="error" title="{{q.raw}}">{{q.code}}</td></tr>{% else %}<tr><td colspan="4">无隔离记录</td></tr>{% endfor %}</tbody></table></div></section>
